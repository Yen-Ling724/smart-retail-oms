# Render 部署設定（Blueprint）
# 一個 Web Service：先打包前端，再由 Express 同時提供 API 和網頁。
# 沒有設定 DATABASE_URL 時使用 PGlite：伺服器重新啟動（免費方案閒置會休眠）就會重建示範資料。
services:
  - type: web
    name: ccc-retail-demo
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
